<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Receipts — the group-chat pick'em that keeps the receipts</title>
    <meta
      name="description"
      content="Sign a pick with your wallet, seal it on Sui before lock, and see who the group should trust: scored against the books, Polymarket and Kalshi."
    />
    <meta name="robots" content="noindex" />
    <meta name="application-name" content="Receipts" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FAF9F6" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#262624" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      Decide the theme before the first paint, as Remora does (ADR-0066). React applies the same
      class after mount, which is long enough for a dark-mode reader to get a white flash. Wrapped
      because storage throws in a private window.
    -->
    <script>
      try {
        const saved = localStorage.getItem("receipts.theme");
        const dark =
          saved === "dark" ||
          ((saved === null || saved === "system") &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
